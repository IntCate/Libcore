# libroce 插件配置（白名单清单）
#
# 把它传给 load(config=本文件) 后：
#   - 只加载 "plugins" 列表里 enabled: true 的插件；
#   - 未列出的目录插件被忽略（白名单）；
#   - enabled: false 的插件被关闭（即使目录里有也不加载）。
# 打开本文件即可看到：有哪些插件、哪些开启、哪些关闭、描述是什么。
plugins:
  - name: pdf_tool
    enabled: true
    description: 解析 PDF 提取文本与分块（配置覆盖）
    ops: [parse]
  - name: vector_store
    enabled: false        # 关闭：不加载
    description: 向量化入库文档