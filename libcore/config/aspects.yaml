# libcore 横切面插件配置（唯一真相源）
# 编辑本文件 -> AspectLoader.watch() 会重建横切管，Agent 下一轮生效。
# 列表顺序 = 拦截顺序：before 正序（先套先跑），after 逆序（后套先跑）。
aspects:
  # 审查类护栏（before 拒绝）：先拒绝，再让观察类记录
  - name: permission
    enabled: true
  - name: circuit_breaker
    enabled: true
    config:
      threshold: 3
  - name: timeout
    enabled: true
    config:
      timeout: 300
  - name: retry
    enabled: true
    config:
      retries: 0
      retry_delay: 0.1
  - name: sandbox
    enabled: true
    config:
      enabled: true   # 沙箱接管执行：把 bash/skill 放到隔离子进程跑（缺省 false = 不接管）
  # 编排治理：迭代预算 + 死循环检测（匹配 loop.iteration 广播）
  # max_iterations 为帧迭代上限护栏，经 config 传入（缺省 25）
  - name: budget_guard
    enabled: true
    config:
      max_iterations: 25
  - name: loop_governor
    enabled: true
    config:
      threshold: 3
  # 编排治理：等待能力上线超时（匹配 loop.iteration 广播，连续 wait 超限熔断）
  # max_waits 为连续 wait 上限护栏，经 config 传入（缺省 50）
  - name: wait_timeout
    enabled: true
    config:
      max_waits: 50
  # 观察类：循环追踪记录（匹配 loop.iteration 广播）
  - name: trace_recorder
    enabled: true
  # 观察类：日志 / 追踪 / 审计 / 遥测
  - name: logging
    enabled: true
  - name: tracing
    enabled: true
  - name: audit
    enabled: true
  - name: telemetry
    enabled: true